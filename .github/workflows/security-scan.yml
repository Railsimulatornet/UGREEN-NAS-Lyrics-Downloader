name: Container security scan

on:
  workflow_call:
    inputs:
      build_version:
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install validation tools on GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck skopeo
      - name: Validate pipeline tests
        shell: bash
        run: |
          set -Eeuo pipefail
          shellcheck .github/scripts/*.sh
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python3 -m py_compile .github/scripts/*.py
      - name: Build and check release package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/package_release.py "$RUNNER_TEMP/lyrics-release"
      - name: Validate build version
        id: buildmeta
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          set -Eeuo pipefail
          [[ "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-build\.[0-9]{8}\.[0-9]+\.[0-9]+)?$ ]]
          echo "version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/lyrics-image"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build AMD64 and ARM64 once
        uses: docker/build-push-action@v7
        with:
          context: ./UGREEN-NAS-Lyrics-Downloader
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: false
          tags: lyrics-downloader:ci
          build-args: VERSION=${{ steps.buildmeta.outputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/lyrics-image/image.tar
          provenance: mode=max
          sbom: true
      - name: Verify and load both architecture candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/lyrics-image/image.tar"
          skopeo copy --all --preserve-digests "oci-archive:$archive" "oci:$RUNNER_TEMP/lyrics-layout"
          skopeo inspect --raw "oci-archive:$archive" > "$RUNNER_TEMP/archive.json"
          skopeo inspect --raw "oci:$RUNNER_TEMP/lyrics-layout" > "$RUNNER_TEMP/layout.json"
          cmp "$RUNNER_TEMP/archive.json" "$RUNNER_TEMP/layout.json"
          for arch in amd64 arm64; do
            skopeo --override-os linux --override-arch "$arch" copy "oci-archive:$archive" "docker-daemon:lyrics-downloader:ci-$arch"
            [[ "$(docker image inspect "lyrics-downloader:ci-$arch" --format '{{.Architecture}}')" == "$arch" ]]
          done
      - name: Offline application tests on both architectures
        shell: bash
        env:
          EXPECTED_BUILD_VERSION: ${{ steps.buildmeta.outputs.version }}
        run: |
          set -Eeuo pipefail
          for arch in amd64 arm64; do
            docker run --rm --platform "linux/$arch" --network none --read-only \
              --user 1009:10 --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:rw,nosuid,nodev,size=64m \
              --env "EXPECTED_BUILD_VERSION=$EXPECTED_BUILD_VERSION" \
              --mount "type=bind,src=$PWD/.github/scripts/smoke_lyrics.py,dst=/tests/smoke_lyrics.py,readonly" \
              --entrypoint python "lyrics-downloader:ci-$arch" /tests/smoke_lyrics.py
          done
      - name: Scan both platforms and enforce security gate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull ghcr.io/aquasecurity/trivy:latest
          TRIVY_IMAGE="$(docker image inspect ghcr.io/aquasecurity/trivy:latest --format '{{.Id}}')"
          [[ "$TRIVY_IMAGE" =~ ^sha256:[a-f0-9]{64}$ ]]
          export TRIVY_IMAGE
          for arch in amd64 arm64; do
            bash .github/scripts/scan-image.sh "$RUNNER_TEMP/lyrics-layout" "linux/$arch" "$PWD/trivy-results/$arch"
          done
      - name: Verify multi-platform registry round trip
        shell: bash
        run: bash .github/scripts/test-image-transfer.sh "$RUNNER_TEMP/lyrics-image/image.tar"
      - name: Upload AMD64 scan results
        if: ${{ always() && hashFiles('trivy-results/amd64/trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: trivy-results/amd64/trivy.sarif
          category: lyrics-amd64
      - name: Upload ARM64 scan results
        if: ${{ always() && hashFiles('trivy-results/arm64/trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: trivy-results/arm64/trivy.sarif
          category: lyrics-arm64
      - name: Save complete scan reports
        if: ${{ always() && hashFiles('trivy-results/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: lyrics-trivy-results
          path: trivy-results/
          retention-days: 30
      - name: Checksum verified image
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/lyrics-image"
          sha256sum image.tar > image.sha256
      - name: Save verified image
        uses: actions/upload-artifact@v7
        with:
          name: lyrics-verified-image
          path: ${{ runner.temp }}/lyrics-image/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Save release package
        uses: actions/upload-artifact@v7
        with:
          name: lyrics-release-package
          path: ${{ runner.temp }}/lyrics-release/
          retention-days: 7
          if-no-files-found: error
