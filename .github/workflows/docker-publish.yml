name: Build and publish Docker image

on:
  pull_request:
    paths: ['UGREEN-NAS-Lyrics-Downloader/**', '.github/**', 'VERSION', 'README.md', 'LICENSE']
  push:
    branches: [main]
    tags: ['v*']
    paths: ['UGREEN-NAS-Lyrics-Downloader/**', '.github/**', 'VERSION', 'README.md', 'LICENSE']
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Serialize complete publishing runs, including metadata selection and release creation.
concurrency:
  group: lyrics-pipeline-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_version: ${{ steps.meta.outputs.build_version }}
      release: ${{ steps.meta.outputs.release }}
      publish: ${{ steps.meta.outputs.publish }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read release and build metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release_metadata.py

  security:
    needs: metadata
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read
      security-events: write
    with:
      build_version: ${{ needs.metadata.outputs.build_version }}

  publish:
    needs: [metadata, security]
    if: ${{ needs.metadata.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: lyrics-verified-image
          path: ${{ runner.temp }}/lyrics-image
      - name: Install registry-copy tool on GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Publish verified image to both registries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -Eeuo pipefail
          (cd "$RUNNER_TEMP/lyrics-image" && sha256sum --check image.sha256)
          bash .github/scripts/publish-image.sh "$RUNNER_TEMP/lyrics-image/image.tar" "$IMAGE_TAG"

  release:
    needs: [metadata, publish]
    if: ${{ needs.metadata.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: lyrics-release-package
          path: ${{ runner.temp }}/lyrics-release
      - name: Publish release without changing existing releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -Eeuo pipefail
          [[ "$(tr -d '\r\n' < VERSION)" == "$RELEASE_VERSION" ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          (cd "$RUNNER_TEMP/lyrics-release" && sha256sum --check SHA256SUMS.txt)
          tag="v$RELEASE_VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/existing-release.json" 2> "$RUNNER_TEMP/release.error"; then
            echo "Release $tag exists; leaving its files and notes unchanged."
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/release.error" || { cat "$RUNNER_TEMP/release.error" >&2; exit 1; }
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "$(cat .github/release-title.txt)" \
              --notes-file .github/release-notes.md --latest \
              "$RUNNER_TEMP/lyrics-release/UGREEN-NAS-Lyrics-Downloader_V$RELEASE_VERSION.zip" \
              "$RUNNER_TEMP/lyrics-release/UGREEN_NAS_Lyrics_Downloader_Handbuch_DE-EN.pdf" \
              "$RUNNER_TEMP/lyrics-release/SHA256SUMS.txt"
          fi
