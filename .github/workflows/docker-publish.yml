name: Build and publish Docker image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/railsimulatornet/ugreen-nas-lyrics-downloader
  DOCKERHUB_IMAGE: railsimulatornet/ugreen-nas-lyrics-downloader

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build security candidate
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --no-cache \
            --build-arg VERSION="${GITHUB_REF_NAME#v}" \
            --tag ugreen-nas-lyrics-downloader:release-candidate \
            ./UGREEN-NAS-Lyrics-Downloader

      - name: Verify runtime dependencies
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python \
            ugreen-nas-lyrics-downloader:release-candidate \
            -c 'import importlib.util, mutagen, requests; assert importlib.util.find_spec("pip") is None; assert importlib.util.find_spec("setuptools") is None; print("Runtime dependencies OK")'

      - name: Security gate
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy:latest \
            image \
            --image-src docker \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            ugreen-nas-lyrics-downloader:release-candidate

  docker:
    needs: security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: ./UGREEN-NAS-Lyrics-Downloader
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
