name: Gesicherte Trivy-Altlast bereinigen

on:
  push:
    branches: [maintenance/trivy-legacy-20261031]
    paths: [.github/workflows/trivy-legacy-cleanup.yml]

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: trivy-legacy-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository_owner == 'Railsimulatornet'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKUP_RUN: ${{ github.event.repository.name == 'schulmanager-homework-watcher' && '41213069483' || '41213208908' }}
    steps:
      - name: Bereits extern gesicherte Bestandsaufnahme laden
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BACKUP_RUN }}
          name: trivy-legacy-inventory-${{ env.BACKUP_RUN }}
          path: ${{ runner.temp }}/trivy-backup
      - name: Nur die exakt gesicherte alte Konfiguration entfernen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          SETTINGS = {
              'Railsimulatornet/schulmanager-homework-watcher': ('41213069483', '41091116f04b52fb6a0c42722b10df2c75d53a630e39b3d4344d1b22e8a7b96b'),
              'Railsimulatornet/UGREEN-NAS-Lyrics-Downloader': ('41213208908', 'c02813a18ead015b03b2b4011173f0d459eab94e9505319611e8d0b4445bd6df'),
          }
          REPO = os.environ['GITHUB_REPOSITORY']
          if REPO not in SETTINGS:
              raise RuntimeError('Nicht freigegebenes Repository')
          RUN, MANIFEST_SHA = SETTINGS[REPO]
          PREFIX = '/repos/' + REPO
          LEGACY = '.github/workflows/security-scan.yml:trivy'
          REF = 'refs/heads/main'
          ROOT = Path(os.environ['RUNNER_TEMP']) / 'trivy-backup'
          manifest = (ROOT / 'SHA256SUMS.txt').read_bytes()
          if hashlib.sha256(manifest).hexdigest() != MANIFEST_SHA:
              raise RuntimeError('Sicherungsmanifest stimmt nicht mit der extern geprueften Kopie ueberein')
          for line in manifest.decode().splitlines():
              digest, name = line.split('  ', 1)
              file = (ROOT / name).resolve()
              if not file.is_relative_to(ROOT.resolve()) or hashlib.sha256(file.read_bytes()).hexdigest() != digest:
                  raise RuntimeError('Ungueltige Sicherungsdatei: ' + name)
          saved = json.loads((ROOT / 'summary.json').read_text())
          if saved['repository'] != REPO or saved['run_id'] != RUN or saved['legacy_category'] != LEGACY or saved['legacy_open_alerts']:
              raise RuntimeError('Sicherung ist nicht fuer diese Bereinigung freigegeben')
          if any(a['state'] != 'fixed' or any(i['state'] != 'fixed' for i in a['instances']) for a in saved['legacy_alerts']):
              raise RuntimeError('Historische Warnungen sind nicht nachweislich behoben')
          EXPECTED_MAIN = saved['main_sha']
          BACKED_IDS = {a['id'] for a in saved['legacy_analyses']}
          if not BACKED_IDS or len(BACKED_IDS) > 100 or saved['legacy_analyses'][0]['results'] != 0:
              raise RuntimeError('Unerwartete historische Analysen')

          def api(route, method='GET'):
              if not route.startswith(PREFIX + '/') or method not in ('GET', 'DELETE'):
                  raise RuntimeError('Ungueltiger API-Aufruf')
              if method == 'DELETE' and route not in {PREFIX + '/code-scanning/analyses/' + str(i) + '?confirm_delete=true' for i in BACKED_IDS}:
                  raise RuntimeError('Loeschziel steht nicht in der gesicherten Freigabeliste')
              req = Request('https://api.github.com' + route, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'trivy-legacy-retirement-20261031',
              })
              with urlopen(req, timeout=45) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          def pages(route):
              result = []
              for page in range(1, 51):
                  part = api(route + ('&' if '?' in route else '?') + urlencode({'per_page': 100, 'page': page}))
                  if not isinstance(part, list):
                      raise RuntimeError('Unvollstaendige API-Antwort')
                  result.extend(part)
                  if len(part) < 100:
                      return result
              raise RuntimeError('Seitengrenze erreicht')

          def is_legacy(a):
              return a.get('ref') == REF and a.get('tool', {}).get('name') == 'Trivy' and a.get('category') == LEGACY and a.get('analysis_key') == LEGACY

          def unchanged_main():
              if api(PREFIX + '/git/ref/heads/main')['object']['sha'] != EXPECTED_MAIN:
                  raise RuntimeError('main wurde geaendert; neue Bestandsaufnahme erforderlich')

          query = urlencode({'tool_name': 'Trivy', 'ref': REF})
          analyses_route = PREFIX + '/code-scanning/analyses?' + query
          alerts_route = PREFIX + '/code-scanning/alerts?' + query
          unchanged_main()
          before = pages(analyses_route)
          pending = [a for a in before if is_legacy(a)]
          if not {a['id'] for a in pending}.issubset(BACKED_IDS):
              raise RuntimeError('Neue, nicht gesicherte Altanalyse vorhanden')
          preserved_ids = {a['id'] for a in before if not is_legacy(a)}
          for category in saved['current_categories']:
              found = [a for a in before if a.get('category') == category]
              if not found:
                  raise RuntimeError('Aktuelle Architektur-Konfiguration fehlt')
              latest = max(found, key=lambda a: (a['created_at'], a['id']))
              if latest['commit_sha'] != EXPECTED_MAIN or latest.get('error'):
                  raise RuntimeError('Aktuelle Architektur-Konfiguration ist nicht gueltig')
          if len(saved['current_categories']) != 2:
              raise RuntimeError('Beide aktuellen Architekturen sind erforderlich')
          current_alerts = pages(alerts_route)
          protected_alerts = {}
          for alert in current_alerts:
              instances = pages(PREFIX + '/code-scanning/alerts/' + str(alert['number']) + '/instances')
              legacy_instances = [i for i in instances if i.get('ref') == REF and i.get('category') == LEGACY and i.get('analysis_key') == LEGACY]
              if legacy_instances and (alert['state'] != 'fixed' or any(i.get('state') != 'fixed' for i in legacy_instances)):
                  raise RuntimeError('Eine historische Warnung ist noch offen')
              if not legacy_instances or any(i.get('ref') == REF and i.get('category') != LEGACY for i in instances):
                  protected_alerts[alert['number']] = alert['state']
          removed = []
          for old in sorted(pending, key=lambda a: (a['created_at'], a['id']), reverse=True):
              unchanged_main()
              live = api(PREFIX + '/code-scanning/analyses/' + str(old['id']))
              if not is_legacy(live) or live.get('deletable') is not True:
                  raise RuntimeError('Analyse ist nicht mehr sicher loeschbar')
              api(PREFIX + '/code-scanning/analyses/' + str(old['id']) + '?confirm_delete=true', 'DELETE')
              removed.append(old['id'])
              print('Gesicherte Altanalyse entfernt:', old['id'])
          after = pages(analyses_route)
          if any(is_legacy(a) for a in after) or not preserved_ids.issubset({a['id'] for a in after}):
              raise RuntimeError('Nachkontrolle der Konfigurationen fehlgeschlagen')
          after_alerts = {a['number']: a['state'] for a in pages(alerts_route)}
          if any(after_alerts.get(number) != state for number, state in protected_alerts.items()):
              raise RuntimeError('Aktuelle Warnungen haben sich unerwartet veraendert')
          report = {'repository': REPO, 'main_sha': EXPECTED_MAIN, 'backup_run': RUN, 'removed_legacy_ids': removed,
                    'retained_analysis_count': len(after), 'protected_alerts': protected_alerts,
                    'historical_fixed_alerts_archived': len(saved['legacy_alerts']), 'verified': True}
          (ROOT / 'cleanup-result.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('## Gepruefte Trivy-Bereinigung\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
          PYTHON
      - name: Sicherung und Bereinigungsnachweis aufbewahren
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-legacy-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/trivy-backup/
          if-no-files-found: error
          retention-days: 90
