# Only the read-only test job checks out PR code. Privileged jobs use trusted main.
name: Dependabot patch auto-merge

on:
  pull_request:
    paths:
      - '.github/workflows/dependabot-automerge.yml'
      - '.github/scripts/dependabot_automerge.py'
      - '.github/scripts/test_dependabot_automerge.py'
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows:
      - CodeQL
      - Build and publish Docker image
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Merge fully verified patch PRs? Default: dry run only.'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Serialize all events: never allow overlapping merge attempts.
concurrency:
  group: dependabot-automerge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout PR for read-only tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run regression tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_dependabot_automerge.py' -v

  classify:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Read trusted Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Mark patch candidates (labels are not merge authorization)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for label in automerge:patch:github-actions automerge:patch:docker automerge:patch:pip; do
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
          done
          [[ "$UPDATE_TYPE" == 'version-update:semver-patch' ]] || exit 0
          case "$ECOSYSTEM" in
            github_actions) label="automerge:patch:github-actions" ;;
            docker) label="automerge:patch:docker" ;;
            pip) label="automerge:patch:pip" ;;
            *) exit 0 ;;
          esac
          gh label create "$label" --repo "$GITHUB_REPOSITORY" \
            --description 'Dependabot patch candidate; merge requires separate safety gates' \
            --color '0E8A16' --force
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$label"

  merge:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.actor.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: write
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Verify current gate code before privileged operation
        run: python3 -m unittest discover -s .github/scripts -p 'test_dependabot_automerge.py' -v
      - name: Check patch PRs, required checks, and versions before merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_APPLY: ${{ inputs.apply }}
        run: |
          set -Eeuo pipefail
          args=()
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$DISPATCH_APPLY" != 'true' ]]; then
            args+=(--dry-run)
          fi
          python3 .github/scripts/dependabot_automerge.py "${args[@]}"
