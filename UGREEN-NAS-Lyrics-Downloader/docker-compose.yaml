services:
  ugreen_lyrics_downloader:
    build:
      context: .
      args:
        VERSION: "1.0.2"
    image: ugreen-nas-lyrics-downloader:1.0.2
    container_name: ugreen_lyrics_downloader
    user: "${PUID:-1000}:${PGID:-10}"
    # Keep the image filesystem immutable; /music, /config and /reports remain bind mounts.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    env_file:
      - .env
    volumes:
      - ${HOST_MUSIC_DIR:-/volume1/Emby/Musik}:/music
      - ./config:/config
      - ./reports:/reports
    restart: "no"
